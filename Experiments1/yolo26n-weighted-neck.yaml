nc: 8
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                # 0  - P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # 1  - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]                # 3  - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]         # 4  - P3 output
  - [-1, 1, Conv, [512, 3, 2]]                # 5  - P4/16
  - [-1, 2, C3k2, [512, True]]                # 6  - P4 output
  - [-1, 1, Conv, [1024, 3, 2]]               # 7  - P5/32
  - [-1, 2, C3k2, [1024, True]]               # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]         # 9
  - [-1, 2, C2PSA, [1024]]                    # 10 - P5 output

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1, 2]]                  # 12 - weighted fusion (P5up + P4)
  - [-1, 2, C3k2, [512, True]]                    # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1, 2]]                  # 15 - weighted fusion (P4'up + P3)
  - [-1, 2, C3k2, [256, True]]                    # 16 - P3_out

  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [[-1, 13], 1, Concat, [1, 2]]                 # 18 - weighted fusion (P3'down + P4')
  - [-1, 2, C3k2, [512, True]]                    # 19 - P4_out

  - [-1, 1, Conv, [512, 3, 2]]                    # 20
  - [[-1, 10], 1, Concat, [1, 2]]                 # 21 - weighted fusion (P4''down + P5)
  - [-1, 2, C3k2, [1024, True]]                   # 22 - P5_out

  - [[16, 19, 22], 1, Detect, [nc]]               # 23
